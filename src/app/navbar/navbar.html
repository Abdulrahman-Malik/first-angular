<nav
  class="fixed inset-x-0 top-0 z-50 h-20
         border-b border-white/[0.07]
         bg-[#080808]/90
         shadow-[0_8px_35px_rgba(0,0,0,0.28)]
         backdrop-blur-2xl"
  dir="rtl"
>
  <!-- Ambient Glow -->
  <div
    class="pointer-events-none absolute inset-x-0 bottom-0 h-px
           bg-gradient-to-r
           from-transparent
           via-orange-500/20
           to-transparent"
  ></div>

  <div class="mx-auto h-full w-full max-w-7xl px-4 sm:px-6 lg:px-8">
    <div class="flex h-full items-center justify-between gap-4">

      <!-- ========================= LOGO ========================= -->

      <a
        routerLink="/"
        class="group flex shrink-0 items-center gap-2.5 no-underline sm:gap-3"
      >
        <!-- Logo Image -->

        <div
          class="relative h-10 w-10 overflow-hidden rounded-xl
                 border border-white/[0.08]
                 bg-white/[0.025]
                 shadow-[0_8px_25px_rgba(0,0,0,0.25)]
                 transition-all duration-500
                 group-hover:scale-105
                 group-hover:border-orange-500/25
                 group-hover:shadow-[0_8px_30px_rgba(242,148,28,0.12)]
                 sm:h-11 sm:w-11
                 lg:h-12 lg:w-12"
        >
          <!-- Logo Glow -->

          <div
            class="pointer-events-none absolute inset-0
                   bg-orange-500/[0.06]
                   opacity-0
                   transition-opacity duration-500
                   group-hover:opacity-100"
          ></div>

          <img
            [src]="path"
            alt="Photography Logo"
            class="relative h-full w-full object-contain
                   transition-transform duration-500
                   group-hover:scale-105"
          />
        </div>

        <!-- Logo Text -->

        <div class="flex flex-col leading-none">
          <span
            class="text-lg font-black tracking-tight
                   bg-gradient-to-l
                   from-white
                   via-white
                   to-neutral-400
                   bg-clip-text
                   text-transparent
                   transition-all duration-300
                   group-hover:from-white
                   group-hover:to-orange-200
                   sm:text-xl"
          >
            عدسة
          </span>

          <span
            class="mt-1 hidden text-[10px]
                   font-medium
                   tracking-wide
                   text-orange-400/70
                   transition-colors duration-300
                   group-hover:text-orange-400
                   sm:block"
          >
            عالم التصوير الفوتوغرافي
          </span>
        </div>
      </a>

      <!-- ========================= DESKTOP NAV ========================= -->

      <div class="hidden md:flex md:items-center">

        <div
          class="flex items-center gap-1
                 rounded-full
                 border border-white/[0.07]
                 bg-[#111111]/90
                 p-1
                 shadow-[inset_0_1px_0_rgba(255,255,255,0.035),0_8px_25px_rgba(0,0,0,0.18)]
                 backdrop-blur-xl"
        >

          <!-- الرئيسية -->

          <a
            routerLink="/home"
            routerLinkActive="bg-gradient-to-r from-orange-500 to-orange-600 text-white shadow-[0_5px_20px_rgba(242,148,28,0.20)]"
            [routerLinkActiveOptions]="{ exact: true }"
            class="relative rounded-full px-4 py-2.5
                   text-sm font-semibold
                   text-neutral-400
                   no-underline
                   transition-all duration-300
                   hover:bg-white/[0.035]
                   hover:text-white
                   sm:px-5"
          >
            الرئيسية
          </a>

          <!-- المدونة -->

          <a
            routerLink="/blog"
            routerLinkActive="bg-gradient-to-r from-orange-500 to-orange-600 text-white shadow-[0_5px_20px_rgba(242,148,28,0.20)]"
            class="relative rounded-full px-4 py-2.5
                   text-sm font-semibold
                   text-neutral-400
                   no-underline
                   transition-all duration-300
                   hover:bg-white/[0.035]
                   hover:text-white
                   sm:px-5"
          >
            المدونة
          </a>

          <!-- من نحن -->

          <a
            routerLink="/blog-details"
            routerLinkActive="bg-gradient-to-r from-orange-500 to-orange-600 text-white shadow-[0_5px_20px_rgba(242,148,28,0.20)]"
            class="relative rounded-full px-4 py-2.5
                   text-sm font-semibold
                   text-neutral-400
                   no-underline
                   transition-all duration-300
                   hover:bg-white/[0.035]
                   hover:text-white
                   sm:px-5"
          >
            من نحن
          </a>

        </div>
      </div>

      <!-- ========================= DESKTOP ACTIONS ========================= -->

      <div class="hidden items-center gap-2.5 md:flex">

        <!-- Search -->

        <button
          type="button"
          aria-label="البحث"
          class="group relative flex h-11 w-11
                 items-center justify-center
                 rounded-xl
                 border border-transparent
                 bg-transparent
                 text-neutral-500
                 transition-all duration-300
                 hover:border-white/[0.08]
                 hover:bg-white/[0.035]
                 hover:text-orange-400
                 focus:outline-none
                 focus:ring-2
                 focus:ring-orange-500/30"
        >
          <svg
            class="h-5 w-5 transition-transform duration-300 group-hover:scale-110"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="m21 21-6-6m2-5a7 7 0 1 1-14 0 7 7 0 0 1 14 0Z"
            />
          </svg>

          <!-- Search Glow -->

          <span
            class="pointer-events-none absolute inset-0
                   rounded-xl
                   bg-orange-500/[0.05]
                   opacity-0
                   transition-opacity duration-300
                   group-hover:opacity-100"
          ></span>
        </button>

        <!-- CTA -->

        <a
          routerLink="/blog"
          class="group relative inline-flex
                 h-11
                 items-center justify-center
                 overflow-hidden
                 rounded-xl
                 bg-gradient-to-r
                 from-orange-500
                 to-orange-600
                 px-5
                 text-sm
                 font-bold
                 text-white
                 no-underline
                 shadow-[0_8px_25px_rgba(242,148,28,0.16)]
                 transition-all duration-300
                 hover:-translate-y-0.5
                 hover:shadow-[0_12px_30px_rgba(242,148,28,0.27)]
                 focus:outline-none
                 focus:ring-2
                 focus:ring-orange-400/40
                 focus:ring-offset-2
                 focus:ring-offset-[#080808]"
        >
          <!-- Shine -->

          <span
            class="absolute inset-0
                   -translate-x-full
                   bg-gradient-to-r
                   from-transparent
                   via-white/20
                   to-transparent
                   transition-transform duration-700
                   group-hover:translate-x-full"
          ></span>

          <span class="relative">
            ابدأ القراءة
          </span>
        </a>

      </div>

      <!-- ========================= MOBILE BUTTON ========================= -->

      <button
        type="button"
        (click)="toggleMobileMenu()"
        aria-label="فتح القائمة"
        class="group flex h-11 w-11
               items-center justify-center
               rounded-xl
               border border-white/[0.07]
               bg-white/[0.025]
               text-neutral-400
               shadow-[inset_0_1px_0_rgba(255,255,255,0.03)]
               transition-all duration-300
               hover:border-orange-500/20
               hover:bg-orange-500/[0.05]
               hover:text-orange-400
               focus:outline-none
               focus:ring-2
               focus:ring-orange-500/30
               md:hidden"
      >
        <svg
          class="h-6 w-6 transition-transform duration-300 group-hover:scale-105"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M4 6h16M4 12h16M4 18h16"
          />
        </svg>
      </button>

    </div>
  </div>

  <!-- ========================= MOBILE MENU ========================= -->

  <div
    [class.hidden]="!isMobileMenuOpen"
    class="absolute left-0 right-0 top-20
           border-b border-white/[0.07]
           bg-[#080808]/98
           px-4 pb-5 pt-3
           shadow-[0_20px_50px_rgba(0,0,0,0.45)]
           backdrop-blur-2xl
           md:hidden"
  >

    <!-- Menu Inner -->

    <div
      class="mx-auto max-w-7xl
             rounded-2xl
             border border-white/[0.06]
             bg-[#101010]/90
             p-2
             shadow-[inset_0_1px_0_rgba(255,255,255,0.035)]"
    >

      <!-- الرئيسية -->

      <a
        routerLink="/home"
        (click)="toggleMobileMenu()"
        class="group flex items-center justify-between
               rounded-xl
               px-4 py-3
               text-sm font-semibold
               text-neutral-300
               no-underline
               transition-all duration-300
               hover:bg-orange-500/[0.07]
               hover:text-white"
      >
        <span>الرئيسية</span>

        <span
          class="h-1.5 w-1.5 rounded-full
                 bg-neutral-700
                 transition-all duration-300
                 group-hover:bg-orange-400
                 group-hover:shadow-[0_0_10px_rgba(242,148,28,.6)]"
        ></span>
      </a>

      <!-- المدونة -->

      <a
        routerLink="/blog"
        (click)="toggleMobileMenu()"
        class="group flex items-center justify-between
               rounded-xl
               px-4 py-3
               text-sm font-semibold
               text-neutral-300
               no-underline
               transition-all duration-300
               hover:bg-orange-500/[0.07]
               hover:text-white"
      >
        <span>المدونة</span>

        <span
          class="h-1.5 w-1.5 rounded-full
                 bg-neutral-700
                 transition-all duration-300
                 group-hover:bg-orange-400
                 group-hover:shadow-[0_0_10px_rgba(242,148,28,.6)]"
        ></span>
      </a>

      <!-- من نحن -->

      <a
        routerLink="/blog-details"
        (click)="toggleMobileMenu()"
        class="group flex items-center justify-between
               rounded-xl
               px-4 py-3
               text-sm font-semibold
               text-neutral-300
               no-underline
               transition-all duration-300
               hover:bg-orange-500/[0.07]
               hover:text-white"
      >
        <span>من نحن</span>

        <span
          class="h-1.5 w-1.5 rounded-full
                 bg-neutral-700
                 transition-all duration-300
                 group-hover:bg-orange-400
                 group-hover:shadow-[0_0_10px_rgba(242,148,28,.6)]"
        ></span>
      </a>

      <!-- CTA -->

      <div class="mt-2 border-t border-white/[0.06] pt-2">

        <a
          routerLink="/blog"
          (click)="toggleMobileMenu()"
          class="group relative flex w-full
                 items-center justify-center
                 overflow-hidden
                 rounded-xl
                 bg-gradient-to-r
                 from-orange-500
                 to-orange-600
                 py-3
                 text-sm
                 font-bold
                 text-white
                 no-underline
                 shadow-[0_8px_25px_rgba(242,148,28,0.16)]
                 transition-all duration-300
                 hover:shadow-[0_12px_30px_rgba(242,148,28,0.25)]"
        >
          <span
            class="absolute inset-0
                   -translate-x-full
                   bg-gradient-to-r
                   from-transparent
                   via-white/20
                   to-transparent
                   transition-transform duration-700
                   group-hover:translate-x-full"
          ></span>

          <span class="relative">
            ابدأ القراءة
          </span>
        </a>

      </div>

    </div>
  </div>
</nav>
