<nav class="site-navbar fixed inset-x-0 top-0 z-50 h-20" dir="rtl">
  <div class="navbar-top-line"></div>
  <div class="navbar-ambient-glow"></div>

  <div class="mx-auto h-full w-full max-w-[1440px] px-4 sm:px-6 lg:px-8">
    <div class="flex h-full items-center justify-between gap-6">
      <a routerLink="/" class="brand group" aria-label="عدسة - الصفحة الرئيسية">
        <div class="brand-logo">
          <span class="brand-logo-ring"></span>
          <span class="brand-logo-glow"></span>

          <img [src]="path" alt="عدسة" class="relative z-10 h-full w-full object-contain" />
        </div>

        <div class="brand-content">
          <span class="brand-name">عدسة</span>
          <span class="brand-description">عالم التصوير الفوتوغرافي</span>
        </div>
      </a>

      <div class="hidden flex-1 justify-center md:flex">
        <div class="main-navigation">
          <a
            routerLink="/home"
            routerLinkActive="is-active"
            [routerLinkActiveOptions]="{ exact: true }"
            class="navigation-link"
          >
            <span class="navigation-text">الرئيسية</span>
            <span class="navigation-indicator"></span>
          </a>

          <a routerLink="/blog" routerLinkActive="is-active" class="navigation-link">
            <span class="navigation-text">المدونة</span>
            <span class="navigation-indicator"></span>
          </a>

          <a routerLink="/about" routerLinkActive="is-active" class="navigation-link">
            <span class="navigation-text">من نحن</span>
            <span class="navigation-indicator"></span>
          </a>
        </div>
      </div>

      <div class="hidden shrink-0 items-center gap-2 md:flex">
        <button type="button" aria-label="البحث" class="search-trigger group">
          <span class="search-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
              <circle cx="11" cy="11" r="7" stroke-width="1.7" />

              <path d="m20 20-4-4" stroke-width="1.7" stroke-linecap="round" />
            </svg>
          </span>
        </button>

        <a routerLink="/blog" class="primary-action group">
          <span class="primary-action-bg"></span>
          <span class="primary-action-shine"></span>

          <span class="primary-action-content">
            <span>ابدأ القراءة</span>
          </span>
        </a>
      </div>

      <button
        type="button"
        (click)="toggleMobileMenu()"
        [attr.aria-expanded]="isMobileMenuOpen"
        [attr.aria-label]="isMobileMenuOpen ? 'إغلاق القائمة' : 'فتح القائمة'"
        class="mobile-trigger group md:hidden"
      >
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </div>

  <div [class.hidden]="!isMobileMenuOpen" class="mobile-panel md:hidden">
    <div class="mobile-panel-inner">
      <div class="mobile-panel-header">
        <span>التنقل</span>

        <span class="mobile-panel-status">
          <span></span>
          عدسة
        </span>
      </div>

      <div class="mobile-navigation">
        <a
          routerLink="/home"
          routerLinkActive="is-active"
          [routerLinkActiveOptions]="{ exact: true }"
          (click)="toggleMobileMenu()"
          class="mobile-navigation-link"
        >
          <span class="mobile-link-content">
            <span class="mobile-link-number">01</span>
            <span>الرئيسية</span>
          </span>

          <span class="mobile-link-arrow">
            <svg viewBox="0 0 24 24" fill="none">
              <path
                d="M9 18l6-6-6-6"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </span>
        </a>

        <a
          routerLink="/blog"
          routerLinkActive="is-active"
          (click)="toggleMobileMenu()"
          class="mobile-navigation-link"
        >
          <span class="mobile-link-content">
            <span class="mobile-link-number">02</span>
            <span>المدونة</span>
          </span>

          <span class="mobile-link-arrow">
            <svg viewBox="0 0 24 24" fill="none">
              <path
                d="M9 18l6-6-6-6"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </span>
        </a>

        <a
          routerLink="/about"
          routerLinkActive="is-active"
          (click)="toggleMobileMenu()"
          class="mobile-navigation-link"
        >
          <span class="mobile-link-content">
            <span class="mobile-link-number">03</span>
            <span>من نحن</span>
          </span>

          <span class="mobile-link-arrow">
            <svg viewBox="0 0 24 24" fill="none">
              <path
                d="M9 18l6-6-6-6"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </span>
        </a>
      </div>

      <div class="mobile-separator"></div>

      <a routerLink="/blog" (click)="toggleMobileMenu()" class="mobile-primary-action group">
        <span class="mobile-action-glow"></span>

        <span class="relative">ابدأ القراءة</span>
      </a>
    </div>
  </div>
</nav>
