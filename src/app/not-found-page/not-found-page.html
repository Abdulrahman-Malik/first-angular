
<main
  dir="rtl"
  class="relative min-h-screen overflow-hidden bg-[#050505] text-white"
>

  <!-- ================================= -->
  <!-- BACKGROUND -->
  <!-- ================================= -->

  <div class="absolute inset-0">

    <!-- Grid -->
    <div
      class="absolute inset-0 opacity-[0.035]"
      style="
        background-image:
          linear-gradient(to right, #ffffff 1px, transparent 1px),
          linear-gradient(to bottom, #ffffff 1px, transparent 1px);
        background-size: 48px 48px;
      "
    ></div>

    <!-- Center Glow -->
    <div
      class="absolute left-1/2 top-1/2
             h-[650px] w-[650px]
             -translate-x-1/2 -translate-y-1/2
             rounded-full
             bg-orange-500/[0.06]
             blur-[160px]"
    ></div>

    <!-- Top Glow -->
    <div
      class="absolute -top-40 left-1/2
             h-[350px] w-[600px]
             -translate-x-1/2
             rounded-full
             bg-orange-500/[0.04]
             blur-[120px]"
    ></div>

  </div>


  <!-- ================================= -->
  <!-- DECORATIVE LINES -->
  <!-- ================================= -->

  <div class="pointer-events-none absolute inset-0">

    <div
      class="absolute left-[8%] top-[25%]
             h-px w-32
             bg-gradient-to-r
             from-transparent
             to-orange-500/30"
    ></div>

    <div
      class="absolute right-[8%] top-[30%]
             h-px w-40
             bg-gradient-to-l
             from-transparent
             to-orange-500/20"
    ></div>

    <div
      class="absolute bottom-[25%] left-[15%]
             h-px w-24
             bg-gradient-to-r
             from-transparent
             to-white/10"
    ></div>

  </div>


  <!-- ================================= -->
  <!-- CONTENT -->
  <!-- ================================= -->

  <section
    class="relative z-10
           flex min-h-screen
           items-center
           justify-center
           px-6 py-20"
  >

    <div
      class="w-full max-w-5xl
             text-center"
    >


      <!-- ================================= -->
      <!-- STATUS -->
      <!-- ================================= -->

      <div class="mb-8 flex justify-center">

        <div
          class="group inline-flex
                 items-center gap-3
                 rounded-full
                 border border-white/[0.08]
                 bg-white/[0.025]
                 px-4 py-2
                 shadow-[0_0_30px_rgba(0,0,0,0.2)]
                 backdrop-blur-xl"
        >

          <span class="relative flex h-2 w-2">

            <span
              class="absolute inset-0
                     animate-ping
                     rounded-full
                     bg-orange-500
                     opacity-60"
            ></span>

            <span
              class="relative
                     h-2 w-2
                     rounded-full
                     bg-orange-500"
            ></span>

          </span>

          <span
            class="text-[11px]
                   font-semibold
                   uppercase
                   tracking-[0.2em]
                   text-neutral-400"
          >
            ERROR 404
          </span>

        </div>

      </div>


      <!-- ================================= -->
      <!-- 404 VISUAL -->
      <!-- ================================= -->

      <div
        class="relative mx-auto
               flex w-fit
               items-center
               justify-center"
      >

        <!-- Outer ring -->
        <div
          class="absolute
                 h-[280px] w-[280px]
                 rounded-full
                 border border-orange-500/[0.08]
                 sm:h-[380px]
                 sm:w-[380px]"
        ></div>


        <!-- Second ring -->
        <div
          class="absolute
                 h-[220px] w-[220px]
                 rounded-full
                 border border-white/[0.05]
                 sm:h-[300px]
                 sm:w-[300px]"
        ></div>


        <!-- 404 -->
        <div
          class="relative
                 select-none
                 text-[130px]
                 font-black
                 leading-none
                 tracking-[-0.1em]
                 sm:text-[190px]
                 md:text-[240px]"
        >

          <span
            class="text-neutral-100
                   drop-shadow-[0_0_30px_rgba(255,255,255,0.04)]"
          >
            4
          </span>


          <!-- Orb -->
          <span
            class="relative mx-[-8px]
                   inline-flex
                   h-[115px] w-[115px]
                   items-center
                   justify-center
                   rounded-full
                   sm:mx-[-12px]
                   sm:h-[165px]
                   sm:w-[165px]
                   md:h-[205px]
                   md:w-[205px]"
          >

            <!-- Orb glow -->
            <span
              class="absolute inset-0
                     rounded-full
                     bg-orange-500/[0.08]
                     blur-2xl"
            ></span>


            <!-- Orb -->
            <span
              class="relative
                     flex h-full w-full
                     items-center
                     justify-center
                     rounded-full
                     border
                     border-orange-400/20
                     bg-gradient-to-br
                     from-orange-300
                     via-orange-500
                     to-orange-700
                     shadow-[0_0_70px_rgba(249,115,22,0.22)]"
            >

              <!-- Inner -->
              <span
                class="absolute
                       inset-[10px]
                       rounded-full
                       border
                       border-white/20
                       bg-[#0a0a0a]
                       shadow-inner
                       sm:inset-[14px]"
              ></span>


              <!-- Core -->
              <span
                class="relative
                       h-3 w-3
                       rounded-full
                       bg-orange-300
                       shadow-[0_0_25px_rgba(253,186,116,0.9)]
                       sm:h-4 sm:w-4"
              ></span>

            </span>

          </span>


          <span
            class="text-neutral-100
                   drop-shadow-[0_0_30px_rgba(255,255,255,0.04)]"
          >
            4
          </span>

        </div>

      </div>


      <!-- ================================= -->
      <!-- TEXT -->
      <!-- ================================= -->

      <div class="mx-auto mt-12 max-w-2xl">

        <h1
          class="text-3xl
                 font-bold
                 tracking-tight
                 text-white
                 sm:text-4xl
                 md:text-5xl"
        >
          يبدو أنك خرجت عن المسار.
        </h1>


        <p
          class="mx-auto mt-5
                 max-w-xl
                 text-sm
                 leading-8
                 text-neutral-500
                 sm:text-base"
        >
          الصفحة التي تحاول الوصول إليها غير موجودة أو ربما تم نقلها.
          لا تقلق، يمكنك العودة إلى الصفحة الرئيسية ومتابعة التصفح.
        </p>

      </div>


      <!-- ================================= -->
      <!-- ACTIONS -->
      <!-- ================================= -->

      <div
        class="mt-9
               flex flex-col
               items-center
               justify-center
               gap-3
               sm:flex-row"
      >

        <!-- Primary -->
        <a
          routerLink="/home"
          class="group
                 relative
                 inline-flex
                 min-w-[190px]
                 items-center
                 justify-center
                 gap-3
                 overflow-hidden
                 rounded-xl
                 bg-orange-500
                 px-7 py-3.5
                 text-sm
                 font-bold
                 text-white
                 shadow-[0_15px_45px_rgba(249,115,22,0.18)]
                 transition-all
                 duration-300
                 hover:-translate-y-1
                 hover:bg-orange-400
                 hover:shadow-[0_20px_55px_rgba(249,115,22,0.3)]"
        >

          <span
            class="absolute inset-0
                   -translate-x-full
                   bg-gradient-to-r
                   from-transparent
                   via-white/20
                   to-transparent
                   transition-transform
                   duration-700
                   group-hover:translate-x-full"
          ></span>

          <span class="relative">
            العودة للرئيسية
          </span>

          <span
            class="relative
                   text-lg
                   transition-transform
                   duration-300
                   group-hover:-translate-x-1"
          >
            ←
          </span>

        </a>


        <!-- Secondary -->
        <button
          type="button"
          onclick="history.back()"
          class="inline-flex
                 min-w-[190px]
                 items-center
                 justify-center
                 gap-2
                 rounded-xl
                 border
                 border-white/[0.08]
                 bg-white/[0.025]
                 px-7 py-3.5
                 text-sm
                 font-semibold
                 text-neutral-300
                 backdrop-blur-xl
                 transition-all
                 duration-300
                 hover:-translate-y-1
                 hover:border-white/[0.15]
                 hover:bg-white/[0.06]
                 hover:text-white"
        >
          العودة للصفحة السابقة
        </button>

      </div>


      <!-- ================================= -->
      <!-- FOOTER DETAIL -->
      <!-- ================================= -->

      <div
        class="mt-14
               flex items-center
               justify-center
               gap-4
               text-[10px]
               uppercase
               tracking-[0.25em]
               text-neutral-700"
      >

        <span class="h-px w-12 bg-white/[0.06]"></span>

        <span>
          Page Not Found
        </span>

        <span class="h-px w-12 bg-white/[0.06]"></span>

      </div>

    </div>

  </section>

</main>
